spring.data.rest.basePath=/v2
server.port=8080

# Native API versioning: header, query parameter and media type parameter resolvers
# (URI path prefixes are resolved by ApiVersionConfig#pathPrefixApiVersionResolver)
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.use.query-parameter=version
spring.mvc.apiversion.use.media-type-parameter[application/vnd.company+json]=v
spring.mvc.apiversion.supported=1,2
spring.mvc.apiversion.default=2
# Only the versions listed above are accepted, even if a mapping declares another one
spring.mvc.apiversion.detect-supported=false

management.endpoints.access.default=none
management.endpoint.health.access=unrestricted
management.endpoint.api-versions.access=unrestricted
management.endpoints.web.exposure.include=health,api-versions
api.v1.enabled=true
