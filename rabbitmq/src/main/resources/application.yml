spring:
  application:
    name: rabbitmq

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: /

    # Publisher confirms for reliable message delivery
    publisher-confirm-type: correlated
    publisher-returns: true

    # Listener configuration
    listener:
      simple:
        # Fair dispatch: one message at a time per worker
        prefetch: 1
        # Default retry configuration (1 attempt + 2 retries)
        retry:
          enabled: true
          initial-interval: 1000
          max-retries: 2
          max-interval: 10000
          multiplier: 2.0

# Actuator health check for RabbitMQ
management:
  health:
    rabbit:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

# Run all pattern demos on startup (DemoRunner)
demo:
  runner:
    enabled: true

logging:
  level:
    com.example.rabbitmq: DEBUG
    org.springframework.amqp: INFO
