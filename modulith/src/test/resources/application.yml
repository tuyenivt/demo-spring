spring:
  datasource:
    url: jdbc:h2:mem:modulith-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: false
  modulith:
    events:
      republish-outstanding-events-on-restart: false

logging:
  level:
    root: WARN
